# Banco para desenvolvimento local: `docker compose up -d postgres`
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: arquitetura_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d arquitetura_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_dados:
